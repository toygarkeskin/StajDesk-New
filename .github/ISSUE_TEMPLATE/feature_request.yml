name: Özellik önerisi
description: Yeni bir özellik veya mevcut bir akışta iyileştirme
title: "[Öneri] "
labels: ["öneri"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Hangi sorunu çözüyor?
      description: Kim, hangi işi yaparken zorlanıyor? Çözümden önce sorunu anlatın.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Önerilen çözüm
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Kimi etkiliyor?
      multiple: true
      options:
        - Çalışan
        - Yönetici
        - IT destek
        - İK
        - Mağaza
        - Sistem yöneticisi
  - type: textarea
    id: alternatives
    attributes:
      label: Değerlendirilen başka yollar
