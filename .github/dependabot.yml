# Bağımlılık güncellemeleri: haftalık, gruplanmış, yalnızca küçük ve yama sürümleri.
# Büyük sürümler (ör. .NET 10 LTS → 11) bilinçli karar gerektirir; elle ve bir karar kaydıyla yapılır.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: weekly }
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
