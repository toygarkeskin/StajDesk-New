name: Release images

# Bir sürüm yayınlandığında (v* etiketi) API, Worker ve Web imajlarını
# GitHub Container Registry'ye (ghcr.io) gönderir. İmajlarda gizli değer yoktur;
# hepsi çalışma anında ortam değişkenlerinden gelir.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # bir imaj başarısız olsa da diğerleri gönderilsin
      matrix:
        include:
          - name: stajdesk-api
            context: ./backend
            args: PROJECT=StajDesk.Api
          - name: stajdesk-worker
            context: ./backend
            args: PROJECT=StajDesk.Worker
          - name: stajdesk-web
            context: ./frontend
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=StajDesk kurumsal çalışan portalı
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
