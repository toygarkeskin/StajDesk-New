# Yalnızca canlı katmanda (docker-compose.prod.yml) bağlanır.
# Portal Caddy'nin arkasındadır; nginx istemcinin gerçek IP'sini Caddy'nin X-Forwarded-For başlığından alır.
# Böylece API'deki IP başına hız sınırı ve denetim kayıtları gerçek istemci adresini görür.
# Güvenilen kaynak yalnızca Docker'ın iç ağlarıdır; canlı katmanda web konteyneri dışarıya port açmaz.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
