# Arayüzün tüm yanıtlarında gönderilen güvenlik başlıkları.
# nginx'te bir location kendi add_header'ını tanımlarsa üst düzeydekiler miras alınmaz;
# bu yüzden başlıklar tek dosyada tutulur ve her location'a dahil edilir.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# İçerik güvenlik politikası:
# - betikler yalnızca kendi kökenimizden (satır içi betik yok)
# - stiller: grafik ve bildirim kütüphaneleri satır içi stil kullandığı için 'unsafe-inline'
# - görseller: yönetimden girilen banner görselleri https adresinden gelebilir
# - bağlantılar: API ve SignalR aynı kökende
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
